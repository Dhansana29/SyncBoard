name: SyncBoard CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Server install
        working-directory: server
        run: npm install
      - name: Server tests
        working-directory: server
        run: npm test
      - name: Client install
        working-directory: client
        run: npm install
      - name: Client tests
        working-directory: client
        run: npm test
