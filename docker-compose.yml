services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [syncboard_mongo:/data/db]

  server:
    build: ./server
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/syncboard
      JWT_SECRET: change_this_secret
      CLIENT_URL: http://localhost:3000
    depends_on: [mongo]
    ports: ["5000:5000"]

  client:
    build: ./client
    environment:
      REACT_APP_API_URL: http://localhost:5000
    depends_on: [server]
    ports: ["3000:3000"]

volumes:
  syncboard_mongo:
